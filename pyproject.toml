[project]
name = "panoptes-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[tool.uv.workspace]
members = ["backend", "workers", "migrations", "packages/contracts", "packages/database", "packages/storage", "packages/ai", "packages/mcp"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires RUN_INTEGRATION_TESTS=true and PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

